# Data configuration
data:
  train_path: "/home/ubuntu/steering_self_preference/verifiable_data_experiments/finetuning_experiments/arena_finetuning_dataset.json"
  test_path: null  # Optional test data path
  validation_split: 0.1 # Split ratio for validation if no test data provided
  max_examples:  500  # Maximum number of examples to use (null = use all). Set to a number like 1000 to limit dataset size

# Model configuration
model:
  model_id: "meta-llama/Meta-Llama-3-8B-Instruct"
  quantization:
    load_in_4bit: true
    bnb_4bit_quant_type: "nf4"
    bnb_4bit_compute_dtype: "bfloat16"
    bnb_4bit_use_double_quant: true

# LoRA configuration
lora:
  r: 8
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  bias: "none"
  task_type: "CAUSAL_LM"
  lora_dropout: 0.1
  finetune_vision_layers: false
  finetune_language_layers: true
  finetune_attention_modules: true
  finetune_mlp_modules: true
  vision_tags: ["vision", "image", "visual", "patch"]
  language_tags: ["language", "text"]
  attention_tags: ["self_attn", "attention", "attn"]
  mlp_tags: ["mlp", "feed_forward", "ffn", "dense"]

# Training configuration
training:
  output_dir: "/home/ubuntu/steering_self_preference/verifiable_data_experiments/finetuning_experiments/output"
  num_train_epochs: 3
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4  # Increased for more stable gradients (effective batch size = 8)
  gradient_checkpointing: true
  optim: "paged_adamw_8bit"
  logging_steps: 1
  learning_rate: 5e-5  # Reduced learning rate to prevent spikes
  fp16: false
  bf16: true
  max_grad_norm: 1.0  # Increased to allow larger gradients before clipping
  lr_scheduler_type: "cosine"  # Changed to cosine for smoother decay
  eval_strategy: "epoch"  # Added evaluation strategy
  save_strategy: "epoch"
  warmup_ratio: 0.1  # Increased warmup to 10% for better stability
  weight_decay: 0.01
  max_seq_length: 4096  # Maximum sequence length for training

# Wandb configuration
wandb:
  project: "gemma-3-12b-it-self-rec"
  name: "gemma-3-12b-it-self-rec-math"
  run_name: "gemma-3-12b-it-self-rec-math-1"

# Hugging Face Hub configuration
hub:
  repo_id:   # Replace with your desired repository ID
